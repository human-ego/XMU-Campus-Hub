name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run cap:sync
      - name: Create test signing key
        run: |
          keytool -genkeypair -keystore android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          printf 'storeFile=debug.keystore\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' > android/debug-keystore.properties
      - name: Build APK
        working-directory: android
        run: bash gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: XMU-Campus-Hub-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
